backend:
  name: git-gateway

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "Site Settings"
        name: "site_settings"
        file: "src/data/site-settings.json"
        format: "json"
        fields:
          - { label: "Lab Name", name: "lab_name", widget: "string" }
          - { label: "PI Name", name: "pi_name", widget: "string" }
          - { label: "Institution", name: "institution", widget: "string", required: false }
          - { label: "Mission Statement", name: "mission_statement", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - label: "Socials"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Funding Logos"
            name: "funding_logos"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Alt text", name: "alt_text", widget: "string" }

  - name: "home"
    label: "Home Page Content"
    files:
      - label: "Home"
        name: "home"
        file: "src/data/home.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Research previews"
            name: "research_previews"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Featured Team Slugs", name: "featured_team", widget: "list", field: {label: "Slug", name: "slug", widget: "string"} }
          - { label: "Featured Mentoring Slugs", name: "featured_mentoring", widget: "list", field: {label: "Slug", name: "slug", widget: "string"} }

  - name: "research"
    label: "Research Page Content"
    files:
      - label: "Research"
        name: "research"
        file: "src/data/research.json"
        format: "json"
        fields:
          - label: "Themes"
            name: "themes"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  - name: "mentoring_page"
    label: "Mentoring Page Settings"
    files:
      - label: "Mentoring Philosophy"
        name: "mentoring_page"
        file: "src/content/mentoringPage/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Resources for trainees"
            name: "trainee_resources"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Mentoring Philosophy", name: "body", widget: "markdown" }

  - name: "join"
    label: "Join Page"
    files:
      - label: "Join Us"
        name: "join"
        file: "src/data/join.json"
        format: "json"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Who we are looking for", name: "who_we_are_looking_for", widget: "list", field: {label: "Item", name: "item", widget: "string"} }
          - { label: "How to apply", name: "how_to_apply", widget: "list", field: {label: "Item", name: "item", widget: "string"} }
          - { label: "Suggested email subject", name: "email_subject", widget: "string" }
          - { label: "Lab culture", name: "culture", widget: "text" }
          - label: "Open positions"
            name: "open_positions"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Details", name: "details", widget: "text" }

  - name: "team"
    label: "Team Members"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position", name: "position", widget: "string" }
      - { label: "Nationality country", name: "nationality_country", widget: "string" }
      - { label: "Nationality flag emoji", name: "nationality_flag_emoji", widget: "string" }
      - { label: "Places lived", name: "places_lived", widget: "list", field: {label: "Place", name: "place", widget: "string"} }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Fun fact", name: "fun_fact", widget: "string" }
      - label: "Links"
        name: "links"
        widget: "object"
        required: false
        fields:
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Google Scholar", name: "scholar", widget: "string", required: false }
          - { label: "ORCID", name: "orcid", widget: "string", required: false }
          - { label: "GitHub", name: "github", widget: "string", required: false }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Featured on home", name: "featured_on_home", widget: "boolean", default: false }

  - name: "mentoring"
    label: "Mentoring Items"
    folder: "src/content/mentoring"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Training", "Career development", "Lab culture", "Courses", "Rotations"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "news"
    label: "Lab News"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", field: {label: "Tag", name: "tag", widget: "string"} }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "fun"
    label: "Lab Fun"
    folder: "src/content/fun"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Caption", name: "caption", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
