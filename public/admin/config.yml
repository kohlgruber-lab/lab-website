backend:
  name: github
  repo: kohlgruber-lab/lab-website
  branch: main
  auth_type: oauth
  squash_merges: true

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "Site Settings"
        name: "site_settings"
        file: "src/data/site-settings.json"
        format: "json"
        fields:
          - { label: "Lab Name", name: "lab_name", widget: "string" }
          - { label: "PI Name", name: "pi_name", widget: "string" }
          - { label: "Institution", name: "institution", widget: "string", required: false }
          - { label: "Mission Statement", name: "mission_statement", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - label: "Socials"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Funding Logos"
            name: "funding_logos"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Alt Text", name: "alt_text", widget: "string" }

  - name: "welcome_page"
    label: "Welcome Page Content"
    files:
      - label: "Welcome"
        name: "welcome"
        file: "src/data/welcome.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Highlight Label", name: "highlight_label", widget: "string", required: false }
              - label: "Primary CTA"
                name: "primary_cta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
              - label: "Secondary CTA"
                name: "secondary_cta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
          - { label: "Culture Preview", name: "culture_preview", widget: "text" }
          - { label: "News Preview Title", name: "news_preview_title", widget: "string" }

  - name: "research_page"
    label: "Research Page Content"
    files:
      - label: "Research"
        name: "research"
        file: "src/data/research-page.json"
        format: "json"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Themes"
            name: "themes"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

    - name: "team"
    label: "Team Members"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position", name: "position", widget: "string" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Nationality Country", name: "nationality_country", widget: "string", required: false }
      - { label: "Nationality Flag", name: "nationality_flag_emoji", widget: "string", required: false }
      - { label: "Places I've lived", name: "places_lived", widget: "list", required: false, field: { label: "Place", name: "place", widget: "string" } }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Short Bio", name: "short_bio", widget: "text", hint: "2–3 sentences for the card preview." }
      - { label: "Expanded Bio", name: "bio", widget: "text", hint: "Longer bio shown on hover." }
      - { label: "Fun Fact", name: "fun_fact", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Featured on Home", name: "featured_on_home", widget: "boolean", default: false }
      
  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "culture"
    label: "Culture Items"
    folder: "src/content/culture"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["Value", "Tradition", "Moment"] }
      - { label: "Date", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }

  - name: "join_page"
    label: "Join Page"
    files:
      - label: "Join"
        name: "join"
        file: "src/data/join.json"
        format: "json"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Who We Are Looking For", name: "who_we_are_looking_for", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
          - { label: "How to Apply", name: "how_to_apply", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
          - { label: "Email Subject", name: "email_subject", widget: "string" }
          - { label: "Culture", name: "culture", widget: "text" }
          - label: "Open Positions"
            name: "open_positions"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Details", name: "details", widget: "text" }

  - name: "contact_page"
    label: "Contact Page"
    files:
      - label: "Contact"
        name: "contact"
        file: "src/data/contact-page.json"
        format: "json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Map Note", name: "map_note", widget: "text" }
